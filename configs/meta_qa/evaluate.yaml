# best configurations for QA hops 2, 3, 4

base_output_dir: "output/metaqa/"
batch_size: 128
test_batch_size: 256
beta: 0.05
data_input_dir: "datasets/nlq/metaqa/"
embedding_size: 50
eval_every: 500
gamma: 1.00
hidden_size: 50
Lambda: 0.05
learning_rate: 0.0001
max_num_actions: 200
num_rollouts: 20
test_rollouts: 100
total_iterations: 15000
train_entity_embeddings: True
train_relation_embeddings: True
print_predictions: False
question_tokenizer_name: "bert-base-uncased"
use_beam: True
use_entity_embeddings: True
vocab_dir: "${data_input_dir}vocab"

# Recommended variables to tune
seed: 0
use_full_graph: True
use_directed_graph: False
path_length: 3
question_format: "full_text"
evaluate_paraphrases: False
raw_QAData_path: "${data_input_dir}/metaqa_qa_nhop.csv"
cached_QAMetaData_path: "./.cache/itl/metaqa_qa_nhop.json"
print_paths: True
load_model: True
model_load_dir: "${base_output_dir}qa_nhop_reason_${path_length}hop_seed${seed}/model/model.ckpt"