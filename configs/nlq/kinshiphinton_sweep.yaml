# WANDB Sweep Configuration for MINERVA
# Usage: wandb sweep ./configs/wandb_sweep_example.yaml
# Then: wandb agent <sweep_id>
project: kinship-hinton-minerva
method: bayes

command:
  - ${env}
  - PYTHONPATH=.
  - python
  - code/model/nlq/trainer.py
  - ${args}

# Define the metric to optimize
metric:
  name: dev/hits@1
  goal: maximize

# Stop criteria
early_terminate:
  type: hyperband
  min_iter: 6

# Parameters to sweep
parameters:
  # Dataset and Data Processing (matching options.py order)
  data_input_dir:
    value: "./datasets/data_preprocessed/kinshiphinton"
  vocab_dir:
    value: "./datasets/data_preprocessed/kinshiphinton/vocab"
  max_num_actions:
    value: 100

  # QA Dataset
  raw_QAData_path:
    value: "./datasets/data_preprocessed/kinshiphinton/kinship_hinton_qa_2hop.csv"
  cached_QAMetaData_path:
    value: "./.cache/itl/kinship_hinton_qa_2hop.json"
  use_full_graph:
    values: [False, True]

  # LSTM/Neural Network Architecture
  hidden_size:
    values: [50, 100, 200]

  # Embedding Configuration
  embedding_size:
    value: 6  # modify later
  use_entity_embeddings:
    values: [False, True]
  train_entity_embeddings:
    value: True

  # Reinforcement Learning
  path_length:
    value: 2
  num_rollouts:
    values: [5, 10, 15, 20, 25, 30]
  gamma:
    values: [0.95, 0.99, 1.0]

  # Training Configuration
  batch_size:
    values: [8, 16]
  learning_rate:
    distribution: q_log_uniform_values
    q: !!float 1e-04
    min: !!float 1e-4
    max: !!float 4e-3
  beta:
    distribution: q_log_uniform_values
    q: !!float 1e-2
    min: !!float 7e-2
    max: !!float 3e-1
  Lambda:
    distribution: uniform
    min: 0.0
    max: 0.1
  total_iterations:
    value: 5000  # Reduced for sweep efficiency
  eval_every:
    value: 100

  # Evaluation Config
  pool:
    value: "max"
  use_beam:
    values: [False, True]

  # Model Loading and Saving
  base_output_dir:
    value: "output/kinshiphinton/sweeps/"

  # Logging and Tracking
  wandb_project:
    value: "kinship-hinton-minerva"
  track:
    value: true
